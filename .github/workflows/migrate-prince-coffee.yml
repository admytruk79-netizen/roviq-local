name: Add Prince Coffee to ROVIQ Local

on:
  push:
    branches: [main]
    paths:
      - migrations/0009_add_prince_coffee_northwest.sql

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Add verified Prince Coffee location
        run: npx wrangler d1 execute roviq-local2 --remote --file=./migrations/0009_add_prince_coffee_northwest.sql
