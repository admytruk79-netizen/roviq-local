name: Release candidate integrity

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/js public/admin functions -type f -name '*.js' -print0)
      - name: Runtime architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/js/location-authority.js' public/index.html
          grep -q '/js/neutral-map-bootstrap.js' public/index.html
          ! grep -q '/js/global-location.js' public/index.html
          grep -q 'radius_km' public/js/services.js
          grep -q "status:'approved'" public/js/services.js
          grep -q "'pending'" functions/api/places/index.js
          grep -q "requireContributor" functions/api/places/index.js
          grep -q "requireModerator" functions/api/admin/moderate.js
          grep -q "Approve & apply verified metadata" public/admin/ai.js
      - name: No accidental ROVIQ Core coupling
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'roviq[-_ ]?core|ROVIQ_CORE|core\.roviq' public functions android --exclude-dir=build; then
            echo 'Unexpected ROVIQ Core reference found in Local runtime.' >&2
            exit 1
          fi

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug app
        run: gradle --no-daemon assembleDebug
