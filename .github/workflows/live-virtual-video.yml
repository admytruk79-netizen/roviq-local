name: Live virtual video verification
on:
  push:
    paths: ['tests/live-virtual-video.browser.cjs', '.github/workflows/live-virtual-video.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy ROVIQ Local2']
    types: [completed]
permissions:
  contents: read
jobs:
  real-video:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        theme: [day, night]
    env:
      ROVIQ_TEST_THEME: ${{ matrix.theme }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Play deployed video through active service worker
        run: node tests/live-virtual-video.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.theme }}-video
          path: test-artifacts/
