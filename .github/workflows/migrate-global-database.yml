name: Migrate ROVIQ Local2 Database

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap ROVIQ2 D1 database' || github.event.head_commit.message == 'Apply ROVIQ Local catalog migrations'
    name: Migrate ROVIQ Local2 D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare secrets are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Bootstrap schema, platform migrations and seed data
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap ROVIQ2 D1 database'
        run: npm run db:bootstrap:remote

      - name: Apply approved catalog migrations
        if: github.event.head_commit.message == 'Apply ROVIQ Local catalog migrations'
        run: |
          npx wrangler d1 execute roviq-local2 --remote --file=./migrations/0009_add_prince_coffee_northwest.sql
          npx wrangler d1 execute roviq-local2 --remote --file=./migrations/0010_add_jebale_coffee_lovejoy.sql
