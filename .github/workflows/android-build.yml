name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and AAB
        run: gradle --no-daemon assembleDebug bundleDebug

      - name: Upload ROVIQ Local debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roviq-local-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ROVIQ Local debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: roviq-local-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload ROVIQ Virtual debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roviq-virtual-debug-apk
          path: android/virtual/build/outputs/apk/debug/virtual-debug.apk

      - name: Upload ROVIQ Virtual debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: roviq-virtual-debug-aab
          path: android/virtual/build/outputs/bundle/debug/virtual-debug.aab

      - name: Check release signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; debug artifacts will still be produced."
          fi

      - name: Prepare release keystore
        if: steps.signing.outputs.ready == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roviq-upload.jks"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          ROVIQ_KEYSTORE_PATH: ${{ runner.temp }}/roviq-upload.jks
          ROVIQ_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ROVIQ_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ROVIQ_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload ROVIQ Local release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roviq-local-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload ROVIQ Local release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roviq-local-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload ROVIQ Virtual release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roviq-virtual-release-apk
          path: android/virtual/build/outputs/apk/release/virtual-release.apk

      - name: Upload ROVIQ Virtual release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roviq-virtual-release-aab
          path: android/virtual/build/outputs/bundle/release/virtual-release.aab
