name: Deploy ROVIQ Local2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker and assets
        run: npm run deploy

      - name: Verify approved places in D1
        shell: bash
        run: |
          npx wrangler d1 execute roviq-local2 --remote --command="SELECT status, COUNT(*) AS count FROM places GROUP BY status;"

      - name: Smoke test live ROVIQ map build
        shell: bash
        run: |
          sleep 8
          BASE="https://roviq-local2.admytruk79.workers.dev"

          HEALTH="$(curl --fail --show-error --silent "$BASE/api/health")"
          echo "$HEALTH" | grep -q '"success":true'

          RESPONSE="$(curl --fail --show-error --silent "$BASE/api/places?status=approved")"
          printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.success||!Array.isArray(x.places)||x.places.length<1){console.error("Live API returned no approved places");process.exit(1)}console.log(`Live API approved places: ${x.places.length}`)})'

          MOCKUP_JS="$(curl --fail --show-error --silent "$BASE/js/mockup-production.js?smoke=${GITHUB_SHA}")"
          printf '%s' "$MOCKUP_JS" | grep -q 'loadExperienceCore'
          printf '%s' "$MOCKUP_JS" | grep -q 'loadStadia'

          CORE_JS="$(curl --fail --show-error --silent "$BASE/js/interaction-core.js?smoke=${GITHUB_SHA}")"
          printf '%s' "$CORE_JS" | grep -q 'ROVIQInteraction'
          printf '%s' "$CORE_JS" | grep -q 'flyTo'

          STADIA_JS="$(curl --fail --show-error --silent "$BASE/js/stadia-vector.js?smoke=${GITHUB_SHA}")"
          printf '%s' "$STADIA_JS" | grep -q 'tiles.stadiamaps.com'
          printf '%s' "$STADIA_JS" | grep -q 'maplibre'

          CORE_CSS="$(curl --fail --show-error --silent "$BASE/css/experience-core.css?smoke=${GITHUB_SHA}")"
          printf '%s' "$CORE_CSS" | grep -q 'roviq-user-halo'

          echo "ROVIQ live smoke test passed"
