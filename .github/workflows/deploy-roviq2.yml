name: Deploy ROVIQ Local2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker and assets
        run: npm run deploy

      - name: Verify approved places in D1
        shell: bash
        run: |
          npx wrangler d1 execute roviq-local2 --remote --command="SELECT status, COUNT(*) AS count FROM places GROUP BY status;"

      - name: Smoke test live API
        shell: bash
        run: |
          sleep 3
          curl --fail --show-error --silent "https://roviq-local2.admytruk79.workers.dev/api/health"
          echo
          RESPONSE="$(curl --fail --show-error --silent "https://roviq-local2.admytruk79.workers.dev/api/places?status=approved")"
          echo "$RESPONSE" | head -c 2000
          echo
          echo "$RESPONSE" | grep -q '"success":true'
          echo "$RESPONSE" | grep -q '"places":\['
