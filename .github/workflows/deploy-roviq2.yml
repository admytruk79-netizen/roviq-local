name: Deploy ROVIQ Local2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker and assets
        run: npm run deploy

      - name: Verify approved places in D1
        shell: bash
        run: |
          npx wrangler d1 execute roviq-local2 --remote --command="SELECT status, COUNT(*) AS count FROM places GROUP BY status;"

      - name: Smoke test live API and AI admin
        shell: bash
        run: |
          sleep 6

          HEALTH="$(curl --fail --show-error --silent "https://roviq-local2.admytruk79.workers.dev/api/health")"
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"success":true'

          RESPONSE="$(curl --fail --show-error --silent "https://roviq-local2.admytruk79.workers.dev/api/places?status=approved")"
          echo "$RESPONSE" | head -c 2500
          echo
          printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.success||!Array.isArray(x.places)||x.places.length<1){console.error("Live API returned no approved places");process.exit(1)}console.log(`Live API approved places: ${x.places.length}`)})'

          ADMIN_HTML="$(curl --fail --show-error --silent "https://roviq-local2.admytruk79.workers.dev/admin/")"
          printf '%s' "$ADMIN_HTML" | grep -q 'AI Maintenance'

          AI_HTML="$(curl --fail --show-error --silent "https://roviq-local2.admytruk79.workers.dev/admin/ai.html")"
          printf '%s' "$AI_HTML" | grep -q 'AI Maintenance'
          printf '%s' "$AI_HTML" | grep -q 'Run check'

          AI_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://roviq-local2.admytruk79.workers.dev/api/admin/ai-maintenance")"
          case "$AI_STATUS" in
            200|401|403) echo "AI maintenance API route is present: HTTP $AI_STATUS" ;;
            *) echo "AI maintenance API route missing or unhealthy: HTTP $AI_STATUS"; exit 1 ;;
          esac
