name: RoviqLocal
options:
  bundleIdPrefix: com.roviq
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
targets:
  RoviqLocal:
    type: application
    platform: iOS
    sources: [RoviqLocal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roviq.local
        INFOPLIST_FILE: RoviqLocal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: ''
    scheme:
      testTargets: []
