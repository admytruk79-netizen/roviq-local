name = "roviq-local2"
main = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "roviq-local2"
database_id = "02852e71-7a65-4fd1-b0ff-2dfc648bb071"

[ai]
binding = "AI"

# Runtime variables/secrets are configured in Cloudflare for this Worker:
#   ADMIN_PASSCODE      shared curator passcode for the /admin tools
#   CRON_SECRET         optional bearer secret for manual cron endpoint calls
#   ROVIQ_CORE_URL      public HTTPS URL for ROVIQ Core
#   ROVIQ_CORE_API_KEY  secret credential for authenticated Core integration
