name = "roviq-local2"
main = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "roviq-local2"
database_id = "02852e71-7a65-4fd1-b0ff-2dfc648bb071"

[ai]
binding = "AI"

# Runtime variables/secrets are configured in Cloudflare for this Worker:
#   ADMIN_PASSCODE      shared curator passcode for the /admin tools
#   CRON_SECRET         optional bearer secret for manual cron endpoint calls


[observability]
enabled = true
head_sampling_rate = 0.1

[[unsafe.bindings]]
name = "PUBLIC_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "WRITE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
