<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ROVIQ Local — Curators</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"><style>body{background:var(--paper)}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.title{font-family:Fraunces,serif;font-size:26px;color:var(--fir)}.sub{font-size:13px;color:var(--ink-soft);margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid rgba(27,59,47,.1);border-radius:16px;padding:16px;margin-top:16px;box-shadow:0 5px 16px rgba(27,59,47,.07)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-transform:uppercase}.field input,.field select{min-height:44px;padding:10px 12px;border:1px solid rgba(27,59,47,.18);border-radius:10px;background:#fff;font:14px Inter,sans-serif}.full{grid-column:1/-1}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.person{font-weight:700;color:var(--fir)}.meta{font:10px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:4px}.assign{font-size:12px;color:var(--ink-soft);margin-top:8px}.token{background:#07192d;color:#e8eef5;border-radius:12px;padding:12px;font:11px 'IBM Plex Mono',monospace;overflow-wrap:anywhere;margin-top:12px}.warning{font-size:12px;color:#8a651c;margin-top:8px}.msg{min-height:18px;margin-top:10px;font-size:12px}.error{color:var(--no)}.success{color:var(--ok)}button{min-height:44px}.danger{border:1px solid rgba(181,80,47,.3);background:#fff;color:var(--no);border-radius:10px;padding:8px 12px;font-weight:600}.empty{text-align:center;padding:30px;color:var(--ink-soft)}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:14px}.card{padding:13px}}</style></head><body><main class="wrap"><div class="top"><div><div class="title">Curators & markets</div><div class="sub">Super-admin control for named moderators and geographic scope.</div></div><div class="nav"><a class="btn btn-outline" href="/admin/">Queue</a><a class="btn btn-outline" href="/admin/manage.html">Places</a></div></div><section class="card"><h2 style="margin:0 0 12px;font-family:Fraunces,serif;color:var(--fir)">Provision or rotate curator</h2><div class="grid"><div class="field"><label>Handle</label><input id="handle" placeholder="alex-portland"></div><div class="field"><label>Display name</label><input id="display-name" placeholder="Alex"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="optional"></div><div class="field"><label>Role</label><select id="role"><option value="curator">Curator</option><option value="regional_admin">Regional admin</option><option value="super_admin">Super admin</option></select></div><div class="field"><label>Market slug</label><input id="market" placeholder="us-or-portland"></div><div class="field"><label>City</label><input id="city" placeholder="Portland"></div><div class="field"><label>Region</label><input id="region" placeholder="Oregon"></div><div class="field"><label>Country code</label><input id="country" maxlength="8" placeholder="US"></div><div class="full"><button class="btn btn-fir" id="provision" type="button">Provision / rotate token</button><div class="msg" id="form-msg"></div><div id="token-wrap" hidden><div class="token" id="token-value"></div><div class="warning">Copy this token now. ROVIQ stores only its hash and cannot display the same token later.</div></div></div></div></section><section class="card"><div class="row"><h2 style="margin:0;font-family:Fraunces,serif;color:var(--fir)">Active curator accounts</h2><button class="btn btn-outline" id="refresh" type="button">Refresh</button></div><div id="users" class="empty">Loading…</div></section></main><script src="/admin/curators.js"></script></body></html>
