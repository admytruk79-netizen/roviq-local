<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roviq Local — Curator Queue</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { background: var(--asphalt); }
  .admin-wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .login-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; gap: 16px; text-align: center;
  }
  .login-wrap input {
    width: 240px; border: 1.5px solid var(--asphalt-line); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; background: var(--asphalt-raised); color: var(--text);
  }
  .login-wrap input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,230,208,.15); }
  .login-error { color: var(--no); font-size: 12.5px; min-height: 16px; }

  .admin-header { padding: 24px 20px 12px; }
  .admin-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: 22px; color: var(--text); }
  .admin-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .queue-count {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--amber);
    background: rgba(255,178,61,.12); border: 1px solid rgba(255,178,61,.3); padding: 4px 10px; border-radius: 100px;
  }

  .queue { flex: 1; overflow-y: auto; padding: 6px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
  .review-card {
    background: var(--asphalt-raised); border-radius: 12px; padding: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35); border: 1px solid var(--asphalt-line);
  }
  .rc-top { display: flex; gap: 10px; }
  .rc-photo {
    width: 52px; height: 52px; border-radius: 10px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--amber), var(--amber-deep));
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background-size: cover; background-position: center;
  }
  .rc-info { flex: 1; min-width: 0; }
  .rc-name { font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; font-size: 15.5px; color: var(--text); }
  .rc-meta { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .rc-desc { font-size: 12px; color: var(--text-soft); margin-top: 8px; line-height: 1.45; }
  .rc-driver { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--steel); margin-top: 8px; }
  .rc-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rc-btn {
    flex: 1; text-align: center; padding: 9px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
    font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: .02em;
    cursor: pointer; border: none;
  }
  .rc-approve { background: var(--ok); color: #04210F; box-shadow: 0 0 12px rgba(57,255,122,.35); }
  .rc-reject { background: transparent; color: var(--no); border: 1.5px solid rgba(255,77,109,.35); }
  .empty-state { text-align: center; color: var(--text-soft); font-size: 13px; padding: 40px 20px; }
  .logout-link { font-size: 11.5px; color: var(--text-soft); text-align: center; padding: 4px 20px 20px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="login-wrap" id="login-wrap">
    <div class="admin-title" style="font-size:24px;">Roviq curator</div>
    <p style="color:var(--text-soft);font-size:13px;max-width:280px;">Enter the curator passcode to review pending driver suggestions.</p>
    <input type="password" id="passcode" placeholder="Passcode" autocomplete="current-password">
    <button class="btn btn-fir" id="login-btn" type="button">Log in</button>
    <div class="login-error" id="login-error"></div>
  </div>

  <div id="queue-wrap" hidden style="display:flex;flex-direction:column;flex:1;">
    <div class="admin-header">
      <div class="admin-title">Review queue</div>
      <div class="admin-sub">Suggestions from Roviq drivers</div>
      <div class="queue-count" id="queue-count">● 0 pending</div>
    </div>
    <div class="queue" id="queue"></div>
    <div class="logout-link" id="logout">Log out</div>
  </div>
</div>
<script src="/admin/app.js"></script>
</body>
</html>
