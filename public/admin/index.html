<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roviq Local — Curator Queue</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { background: var(--paper); }
  .admin-wrap { max-width: 620px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .login-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; gap: 16px; text-align: center; }
  .login-wrap input { width: 280px; max-width:90vw; border: 1.5px solid rgba(27,59,47,.18); border-radius: 12px; padding: 12px 14px; font-size: 14px; min-height:44px; }
  .login-error { color: var(--no); font-size: 12.5px; min-height: 16px; }
  .admin-header { padding: 24px 20px 12px; }
  .admin-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; color: var(--fir); }
  .admin-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .admin-nav { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .admin-nav a { min-height:40px; display:inline-flex; align-items:center; }
  .queue-count { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--brass); background: #FBF1E0; padding: 4px 10px; border-radius: 100px; }
  .ops-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ops-chip{font:10px 'IBM Plex Mono',monospace;background:#fff;border:1px solid rgba(27,59,47,.1);padding:6px 9px;border-radius:999px;color:var(--ink-soft)}
  .section-title{padding:8px 20px 0;font:600 13px Inter,sans-serif;color:var(--fir);display:flex;justify-content:space-between;gap:10px}.section-title button{border:0;background:transparent;color:var(--brass);font:600 11px Inter,sans-serif;cursor:pointer}
  .queue { padding: 6px 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .review-card { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 4px 14px rgba(27,59,47,.08); border: 1px solid rgba(27,59,47,.08); }
  .rc-top { display: flex; gap: 10px; }.rc-photo { width: 52px; height: 52px; border-radius: 12px; flex: 0 0 auto; background: linear-gradient(135deg, var(--brass-soft), var(--brass)); display: flex; align-items: center; justify-content: center; font-size: 22px; background-size: cover; background-position: center; }
  .rc-info { flex: 1; min-width: 0; }.rc-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--fir); }.rc-meta { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; overflow-wrap:anywhere; }.rc-desc { font-size: 12px; color: var(--ink-soft); margin-top: 8px; line-height: 1.45; }.rc-driver { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--mist); margin-top: 8px; overflow-wrap:anywhere; }
  .rc-actions { display: flex; gap: 8px; margin-top: 12px; }.rc-btn { flex: 1; text-align: center; padding: 9px; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; min-height:44px; }.rc-approve { background: var(--ok); color: #fff; }.rc-reject { background: #fff; color: var(--no); border: 1.5px solid rgba(181,80,47,.3); }.empty-state { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 28px 20px; }
  .activity{padding:6px 20px 28px;display:flex;flex-direction:column;gap:8px}.activity-item{background:#fff;border:1px solid rgba(27,59,47,.08);border-radius:12px;padding:10px 12px}.activity-item strong{color:var(--fir);font-size:12.5px}.activity-meta{font:9.5px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:3px}.activity-note{font-size:11px;color:var(--ink-soft);margin-top:5px}.logout-link { font-size: 11.5px; color: var(--ink-soft); text-align: center; padding: 4px 20px 20px; cursor: pointer; text-decoration: underline; }
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(173,128,52,.55);outline-offset:3px}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="login-wrap" id="login-wrap">
    <div class="admin-title" style="font-size:24px;">ROVIQ curator</div>
    <p style="color:var(--ink-soft);font-size:13px;max-width:320px;">Enter your curator token. The legacy super-admin passcode also works during migration.</p>
    <input type="password" id="passcode" placeholder="Curator token or admin passcode" autocomplete="current-password">
    <button class="btn btn-fir" id="login-btn" type="button">Log in</button>
    <div class="login-error" id="login-error"></div>
  </div>
  <div id="queue-wrap" hidden style="display:flex;flex-direction:column;flex:1;">
    <div class="admin-header">
      <div class="admin-title">Review queue</div>
      <div class="admin-sub" id="admin-sub">Authenticated curator</div>
      <div class="queue-count" id="queue-count">● 0 pending</div>
      <div class="ops-strip" id="market-summary"></div>
      <div class="admin-nav"><a class="btn btn-outline" href="/admin/manage.html">Control center</a><a class="btn btn-outline" href="/admin/ai.html">AI Maintenance</a><a class="btn btn-outline" id="curator-admin-link" href="/admin/curators.html" hidden>Curators</a></div>
    </div>
    <div class="section-title"><span>Needs attention</span><button id="refresh-queue" type="button">Refresh</button></div>
    <div class="queue" id="queue"></div>
    <div class="section-title"><span>Recent moderation activity</span><button id="refresh-activity" type="button">Refresh</button></div>
    <div class="activity" id="activity"></div>
    <div class="logout-link" id="logout">Log out</div>
  </div>
</div>
<script src="/admin/app.js"></script>
</body>
</html>
