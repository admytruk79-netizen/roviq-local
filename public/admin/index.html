<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#030a10;--panel:rgba(6,16,24,.92);--panel2:rgba(9,22,30,.86);--gold:#d7a55b;--gold2:#efc276;--teal:#58dfcf;--ivory:#f7f0e7;--muted:#aeb7b7;--red:#d77968;--green:#67d8a5;--line:rgba(215,165,91,.22)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,rgba(88,223,207,.08),transparent 28%),radial-gradient(circle at 90% 10%,rgba(215,165,91,.09),transparent 24%),linear-gradient(180deg,#071019,#02070b 68%);color:var(--ivory);font-family:Inter,system-ui,sans-serif}.admin-wrap{max-width:860px;margin:0 auto;min-height:100vh;padding-bottom:calc(26px + env(safe-area-inset-bottom))}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.login-card{width:min(440px,94vw);padding:30px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(8,20,29,.96),rgba(3,11,17,.95));box-shadow:0 30px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(24px);text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;clip-path:polygon(50% 0,92% 24%,92% 76%,50% 100%,8% 76%,8% 24%);border:1px solid var(--gold);background:rgba(215,165,91,.08);font:600 24px Cinzel;color:var(--gold2)}.admin-title{font:600 24px/1.1 Cinzel,Georgia,serif;letter-spacing:.04em;color:var(--gold2)}.admin-sub{font-size:12px;color:var(--muted);margin-top:6px}.login-card p{color:var(--muted);font-size:13px;line-height:1.55}.login-card input,.review-note{width:100%;min-height:48px;border:1px solid rgba(215,165,91,.25);border-radius:14px;background:rgba(255,255,255,.035);color:var(--ivory);padding:12px 14px;font:500 13px Inter;outline:none}.login-card input:focus,.review-note:focus{border-color:rgba(88,223,207,.65);box-shadow:0 0 0 4px rgba(88,223,207,.08)}.btn{min-height:46px;border-radius:13px;border:1px solid rgba(215,165,91,.28);background:rgba(215,165,91,.08);color:var(--gold2);font:700 12px Inter;letter-spacing:.02em;padding:0 15px;cursor:pointer}.btn.primary{width:100%;margin-top:12px;border-color:rgba(88,223,207,.55);background:linear-gradient(180deg,rgba(88,223,207,.24),rgba(88,223,207,.12));color:#b8fff4}.login-error{min-height:18px;margin-top:10px;color:#ff9c8b;font-size:12px}.admin-header{position:sticky;top:0;z-index:10;padding:calc(18px + env(safe-area-inset-top)) 20px 15px;background:linear-gradient(180deg,rgba(3,10,16,.98),rgba(3,10,16,.82),transparent);backdrop-filter:blur(18px)}.header-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.queue-count{display:inline-flex;margin-top:10px;border:1px solid rgba(88,223,207,.23);border-radius:999px;padding:6px 10px;background:rgba(88,223,207,.07);color:var(--teal);font:500 10px IBM Plex Mono,monospace}.ops-strip,.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ops-chip,.admin-nav a{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:var(--muted);padding:7px 10px;font:500 10px IBM Plex Mono;text-decoration:none}.admin-nav a{color:var(--gold2)}.section-title{padding:14px 20px 5px;display:flex;justify-content:space-between;align-items:center;color:var(--ivory);font:700 12px Inter;letter-spacing:.04em;text-transform:uppercase}.section-title button{border:0;background:transparent;color:var(--teal);font:600 11px Inter}.queue{padding:8px 16px 18px;display:grid;gap:14px}.review-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(11,25,34,.96),rgba(4,13,20,.97));box-shadow:0 18px 50px rgba(0,0,0,.34);padding:16px}.review-card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(239,194,118,.72),transparent)}.rc-top{display:flex;gap:13px}.rc-photo{width:64px;height:64px;border-radius:16px;flex:0 0 auto;background:linear-gradient(135deg,#15323a,#6a4e25);background-size:cover;background-position:center;display:grid;place-items:center;font-size:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.rc-info{min-width:0;flex:1}.rc-name{font:600 18px Cinzel,serif;color:var(--ivory)}.rc-meta{margin-top:5px;color:var(--teal);font:500 9.5px/1.45 IBM Plex Mono,monospace;text-transform:uppercase;overflow-wrap:anywhere}.rc-block{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}.rc-label{font:700 9px IBM Plex Mono;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase}.rc-copy{margin-top:5px;font-size:12.5px;line-height:1.48;color:#d7dedd}.rc-driver{margin-top:10px;color:#89979b;font:500 10px IBM Plex Mono}.review-note{margin-top:12px;min-height:72px;resize:vertical}.rc-actions{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-top:10px}.rc-btn{min-height:44px;border-radius:12px;font:700 11px Inter;cursor:pointer}.rc-reject{border:1px solid rgba(215,121,104,.36);background:rgba(215,121,104,.06);color:#f19a89}.rc-change{border:1px solid rgba(215,165,91,.32);background:rgba(215,165,91,.07);color:var(--gold2)}.rc-approve{border:1px solid rgba(103,216,165,.4);background:linear-gradient(180deg,rgba(103,216,165,.19),rgba(103,216,165,.08));color:#93ecc4}.rc-btn:disabled{opacity:.45}.empty-state{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed rgba(215,165,91,.18);border-radius:18px}.activity{padding:7px 16px 28px;display:grid;gap:8px}.activity-item{border:1px solid rgba(255,255,255,.06);border-radius:14px;background:rgba(255,255,255,.025);padding:11px 12px}.activity-item strong{font-size:12px;color:var(--ivory)}.activity-meta{margin-top:3px;color:#8d9a9d;font:9.5px IBM Plex Mono}.activity-note{margin-top:6px;color:#c8d0cf;font-size:11px}.logout-link{text-align:center;color:#809095;font-size:11px;padding:8px 20px 22px;cursor:pointer}@media(max-width:600px){.rc-actions{grid-template-columns:1fr 1fr}.rc-approve{grid-column:1/-1}.admin-nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.admin-nav a{white-space:nowrap}.review-card{border-radius:18px}.rc-photo{width:56px;height:56px}}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(88,223,207,.45);outline-offset:3px}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="login-wrap" id="login-wrap"><div class="login-card"><div class="mark">R</div><div class="admin-title">ROVIQ curator</div><p>Review local knowledge before it becomes part of the discovery layer.</p><input type="password" id="passcode" placeholder="Curator token or admin passcode" autocomplete="current-password"><button class="btn primary" id="login-btn" type="button">Enter review workspace</button><div class="login-error" id="login-error"></div></div></div>
  <div id="queue-wrap" hidden>
    <header class="admin-header"><div class="header-row"><div><div class="admin-title">Review queue</div><div class="admin-sub" id="admin-sub">Authenticated curator</div></div><div class="mark" style="width:44px;height:44px;font-size:18px;margin:0">R</div></div><div class="queue-count" id="queue-count">● 0 pending</div><div class="ops-strip" id="market-summary"></div><nav class="admin-nav"><a href="/admin/manage.html">Control center</a><a href="/admin/markets.html">Markets</a><a href="/admin/ai.html">AI maintenance</a><a id="curator-admin-link" href="/admin/curators.html" hidden>Curators</a></nav></header>
    <div class="section-title"><span>Needs attention</span><button id="refresh-queue" type="button">Refresh</button></div><div class="queue" id="queue"></div>
    <div class="section-title"><span>Recent moderation activity</span><button id="refresh-activity" type="button">Refresh</button></div><div class="activity" id="activity"></div><div class="logout-link" id="logout">Log out</div>
  </div>
</div>
<script src="/admin/app.js?v=20260825-2"></script>
</body>
</html>
