<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ROVIQ Local — Markets</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
body{background:var(--paper)}.wrap{max-width:760px;margin:0 auto;padding:22px 18px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.title{font:600 25px 'Fraunces',serif;color:var(--fir)}.sub{font:12px Inter,sans-serif;color:var(--ink-soft);margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#fff;border:1px solid rgba(27,59,47,.08);border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 5px 18px rgba(27,59,47,.06)}.panel h2{font:600 16px 'Fraunces',serif;color:var(--fir);margin:0 0 10px}.grid{display:grid;grid-template-columns:2fr 1.2fr .7fr .8fr;gap:8px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.grid .city{grid-column:1/-1}}input,select{width:100%;border:1px solid rgba(27,59,47,.15);border-radius:10px;padding:11px 12px;min-height:44px;font:13px Inter,sans-serif;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font:11px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:10px;min-height:16px}.markets{display:flex;flex-direction:column;gap:9px}.market{border:1px solid rgba(27,59,47,.09);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff}.market strong{color:var(--fir);font-size:14px}.meta{font:10px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:3px}.badge{font:10px 'IBM Plex Mono',monospace;border-radius:999px;padding:4px 8px;background:#f3efe6;color:var(--brass)}.candidate{border:1px solid rgba(27,59,47,.09);border-radius:14px;padding:13px;margin-top:9px;background:#fff}.candidate-top{display:flex;justify-content:space-between;gap:10px}.candidate h3{font:600 15px 'Fraunces',serif;color:var(--fir);margin:0}.score{font:600 11px 'IBM Plex Mono',monospace;color:var(--brass)}.reason{font-size:12px;line-height:1.45;color:var(--ink-soft);margin-top:8px}.candidate .actions button{flex:1}.empty{padding:18px;text-align:center;color:var(--ink-soft);font-size:12px}.btn-danger{background:#fff;color:var(--no);border:1px solid rgba(181,80,47,.3)}.btn-ok{background:var(--ok);color:#fff;border:0}.section-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.section-head h2{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">Market expansion</div><div class="sub">Activate a city, review AI-ranked candidates, then publish only what a curator approves.</div></div>
    <div class="nav"><a class="btn btn-outline" href="/admin/">Queue</a><a class="btn btn-outline" href="/admin/manage.html">Control center</a><a class="btn btn-outline" href="/admin/ai.html">AI Maintenance</a></div>
  </div>

  <section class="panel">
    <h2>Add market</h2>
    <div class="grid">
      <input class="city" id="city" placeholder="City, e.g. Seattle" autocomplete="address-level2">
      <input id="region" placeholder="State / region, e.g. WA" autocomplete="address-level1">
      <input id="country" value="US" maxlength="2" placeholder="US">
      <input id="radius" type="number" min="5" max="100" value="25" placeholder="Radius km">
    </div>
    <div class="actions"><button class="btn btn-fir" id="activate" type="button">Activate market</button><button class="btn btn-outline" id="refresh" type="button">Refresh</button></div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>Markets</h2><span class="badge" id="market-count">0</span></div>
    <div class="markets" id="markets"></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2 id="candidate-title">Candidate queue</h2><select id="candidate-status" style="width:auto"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div>
    <div id="candidates"></div>
  </section>
</div>
<script src="/admin/markets.js"></script>
</body>
</html>
