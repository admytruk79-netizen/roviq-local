<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROVIQ Local — AI Maintenance</title><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"><style>body{background:var(--paper)}.wrap{max-width:720px;margin:0 auto;min-height:100vh;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font:600 24px Fraunces,serif;color:var(--fir)}.sub{font-size:12px;color:var(--ink-soft);margin-top:3px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid rgba(27,59,47,.08);border-radius:14px;padding:12px}.stat strong{display:block;font:700 22px Inter;color:var(--fir)}.stat span{font:10px IBM Plex Mono,monospace;color:var(--ink-soft);text-transform:uppercase}.run{display:flex;gap:8px;align-items:center;margin:12px 0}.run input{width:70px;padding:10px;border-radius:10px;border:1px solid rgba(27,59,47,.15)}.items{display:flex;flex-direction:column;gap:12px;margin-top:12px}.card{background:#fff;border:1px solid rgba(27,59,47,.08);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(27,59,47,.06)}.row{display:flex;justify-content:space-between;gap:10px}.name{font:600 16px Fraunces,serif;color:var(--fir)}.meta{font:9.5px IBM Plex Mono,monospace;color:var(--ink-soft);margin-top:3px}.issue{font:700 10px IBM Plex Mono,monospace;color:var(--brass);text-transform:uppercase}.desc{font-size:12px;line-height:1.45;color:var(--ink-soft);margin-top:9px}.changes{margin-top:9px;font:10px IBM Plex Mono,monospace;color:var(--ink-soft);white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;min-height:42px;border-radius:10px;font-weight:600}.approve{background:var(--ok);color:#fff;border:0}.reject{background:#fff;color:var(--no);border:1px solid rgba(181,80,47,.3)}.empty{padding:28px;text-align:center;color:var(--ink-soft);font-size:13px}.status{font-size:12px;color:var(--ink-soft);min-height:18px}</style></head><body><main class="wrap"><div class="top"><div><div class="title">AI Maintenance</div><div class="sub">Factual verification engine · human-reviewed changes only</div></div><a class="btn btn-outline" href="/admin/">Back</a></div><div class="nav"><button class="btn btn-outline" id="refresh" type="button">Refresh</button><button class="btn btn-fir" id="run" type="button">Run check</button><label class="run">Batch <input id="limit" type="number" min="1" max="25" value="10"></label></div><div class="stats"><div class="stat"><strong id="pending">0</strong><span>Pending review</span></div><div class="stat"><strong id="approved">0</strong><span>Approved findings</span></div><div class="stat"><strong id="rejected">0</strong><span>Rejected findings</span></div><div class="stat"><strong id="resolved">0</strong><span>Resolved</span></div></div><div class="status" id="status"></div><section class="items" id="items"></section></main><script src="/admin/ai.js"></script></body></html>
